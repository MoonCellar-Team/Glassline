plugins {
    id "com.android.application"
}

def out = file(project.findProperty("medecompOut") ?: "${rootDir}/../build/android")
def sdl = project.findProperty("medecompSdl") ?: "SDL2-2.30.10"

android {
    namespace "space.mooncellar.rooftops"
    compileSdk 35

    defaultConfig {
        applicationId "space.mooncellar.rooftops"
        minSdk 28
        targetSdk 35
        versionCode((project.findProperty("medecompVersionCode") ?: "1") as int)
        versionName project.findProperty("medecompVersion") ?: "dev"
    }

    signingConfigs {
        if (System.getenv("GLASSLINE_ANDROID_KEYSTORE")) {
            release {
                storeFile file(System.getenv("GLASSLINE_ANDROID_KEYSTORE"))
                storePassword System.getenv("GLASSLINE_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("GLASSLINE_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("GLASSLINE_ANDROID_KEY_PASSWORD")
            }
        }
    }

    sourceSets {
        main {
            java.srcDirs = ["src/main/java", "${out}/src/${sdl}/android-project/app/src/main/java"]
            jniLibs.srcDirs = ["${out}/jniLibs"]
            assets.srcDirs = ["${out}/assets"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("GLASSLINE_ANDROID_KEYSTORE") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

layout.buildDirectory = file("${out}/gradle-out/app")
