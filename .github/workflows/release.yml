name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh linux "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/release/*-linux-x64-*.AppImage
            build/release/*-linux-x64-*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh windows "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/release/*-windows-x64-*.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        # The Android SDK with the NDK and the build take about 12 GB; the runner's own SDKs are not used
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@v6
      - name: Release signing key
        env:
          KEYSTORE: ${{ secrets.GLASSLINE_ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo "no GLASSLINE_ANDROID_KEYSTORE secret: the APK would not be signed with the release key"; exit 1; }
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build
        env:
          GLASSLINE_ANDROID_KEYSTORE: ${{ runner.temp }}/release.keystore
          GLASSLINE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.GLASSLINE_ANDROID_KEYSTORE_PASSWORD }}
          GLASSLINE_ANDROID_KEY_ALIAS: ${{ secrets.GLASSLINE_ANDROID_KEY_ALIAS }}
          GLASSLINE_ANDROID_KEY_PASSWORD: ${{ secrets.GLASSLINE_ANDROID_KEY_PASSWORD }}
        run: |
          python3 -I tools/android_deps.py --accept-licenses > /dev/null
          ./build.sh android "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/release/*-android-*.apk
          if-no-files-found: error

  release:
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign for the launcher's updater
        # An ed25519 signature of the sha512sum line of every AppImage and zip (<file>.sig): the launcher checks it
        # before updating (port/src/platform/update.cpp); the public key is MEDECOMP_UPDATE_KEY in port/include/port/brand.h
        env:
          GLASSLINE_UPDATE_KEY: ${{ secrets.GLASSLINE_UPDATE_KEY }}
        run: |
          test -n "$GLASSLINE_UPDATE_KEY" || { echo "no GLASSLINE_UPDATE_KEY secret: the release would not be signed"; exit 1; }
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$GLASSLINE_UPDATE_KEY" > "$key"
          cd dist
          for f in *.AppImage *.zip; do
            sha512sum "$f" > "$f.line"
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$f.line" -out "$f.sig"
            rm "$f.line"
          done
          ls -l
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v) ; next }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no section for $version in CHANGELOG.md"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Glassline ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
